<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wordle</title>
    <link rel="stylesheet" href="./assets/styles/style.css" />
  </head>
  <body>
    <!-- TODO: Build the accessible header, theme button, game grid, and status region. -->
    <header>
      <h1 class="animate__animated animate__pulse animate__infinite">Wordle</h1>
      <button id="mode-toggle" aria-label="Toggle color theme" type="button">

    <main id="game">
      <div id="wordle-grid"></div>
      <div id="game-result" role="status" aria-live="polite"></div>
    </main>

    <script src="./assets/scripts/dark-mode-toggle.js" type="module"></script>
    <script src="./assets/scripts/main.js" type="module"></script>
  </body>
</html>
